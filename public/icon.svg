<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient in soft blush rose -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="35%" stop-color="#fce7f3"/>
      <stop offset="70%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Golden border gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Ribbon Satin Pink Gradient -->
    <linearGradient id="satinPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="ribbonShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Squircle for Mac Dock & Mobile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer delicate decorative gold ring -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.8"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" stroke-dasharray="8 6"/>

  <!-- Center Card / Book Plate with shadow -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="64" fill="#ffffff" stroke="#fce7f3" stroke-width="4"/>
  </g>

  <!-- Cute Golden Stitched Inner Border -->
  <rect x="110" y="110" width="292" height="292" rx="52" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Twinkles and Sparkles in background -->
  <g fill="#f59e0b" opacity="0.85">
    <!-- Top right sparkle -->
    <path d="M 370 140 Q 370 155 385 155 Q 370 155 370 170 Q 370 155 355 155 Q 370 155 370 140 Z"/>
    <!-- Bottom left sparkle -->
    <path d="M 145 365 Q 145 376 156 376 Q 145 376 145 387 Q 145 376 134 376 Q 145 376 145 365 Z"/>
    <!-- Tiny star -->
    <circle cx="360" cy="350" r="4" fill="#fb7185"/>
    <circle cx="150" cy="150" r="5" fill="#f472b6"/>
  </g>

  <!-- THE ICON CENTERPIECE: Elegant Satin Ribbon Bow (Coquette Aesthetic 🎀) -->
  <g transform="translate(256, 235)">
    <!-- Ribbon Left Loop -->
    <path d="M 0,-10 C -45,-75 -115,-45 -100,10 C -90,45 -35,25 0,0 Z" fill="url(#satinPink)" filter="url(#shadow)"/>
    <path d="M -15,-5 C -45,-50 -85,-30 -75,10 C -70,25 -35,15 -15,-5 Z" fill="#fda4af" opacity="0.6"/>

    <!-- Ribbon Right Loop -->
    <path d="M 0,-10 C 45,-75 115,-45 100,10 C 90,45 35,25 0,0 Z" fill="url(#satinPink)" filter="url(#shadow)"/>
    <path d="M 15,-5 C 45,-50 85,-30 75,10 C 70,25 35,15 15,-5 Z" fill="#fda4af" opacity="0.6"/>

    <!-- Ribbon Left Tail -->
    <path d="M -10,10 C -35,45 -70,95 -85,115 C -65,110 -55,100 -40,115 C -30,85 -10,35 0,10 Z" fill="url(#ribbonShadow)"/>

    <!-- Ribbon Right Tail -->
    <path d="M 10,10 C 35,45 70,95 85,115 C 65,110 55,100 40,115 C 30,85 10,35 0,10 Z" fill="url(#ribbonShadow)"/>

    <!-- Center Bow Knot -->
    <ellipse cx="0" cy="0" rx="20" ry="18" fill="url(#satinPink)"/>
    <ellipse cx="-4" cy="-4" rx="10" ry="7" fill="#fecdd3" opacity="0.7"/>

    <!-- Heart Charm Hanging in Center -->
    <g transform="translate(0, 32)">
      <path d="M 0,22 C -2,22 -18,8 -18,-4 C -18,-14 -10,-20 0,-12 C 10,-20 18,-14 18,-4 C 18,8 2,22 0,22 Z" fill="#fb7185"/>
      <path d="M 0,18 C -1,18 -14,6 -14,-3 C -14,-10 -8,-15 0,-8 C 8,-15 14,-10 14,-3 C 14,6 1,18 0,18 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- Typography at bottom: "MY PLANNER" -->
  <text x="256" y="385" font-family="'Heebo', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#9d174d" text-anchor="middle">
    MY PLANNER
  </text>
</svg>
